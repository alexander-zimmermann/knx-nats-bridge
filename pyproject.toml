[project]
name = "knx-nats-bridge"
version = "0.25.0"
description = "Bridge KNX telegrams to NATS JetStream with DPT decoding"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.15.2"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
]
dependencies = [
    "xknx>=4.0.0",
    "nats-bridge-core @ git+https://github.com/alexander-zimmermann/nats-bridge-core@v0.10.0",
    "nats-py[nkeys]>=2.16.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
tools = [
    "xknxproject>=3.10.0",
]
# Only the import-catalog CLI (Kubernetes Job) talks to TimescaleDB; keep
# psycopg out of plain `pip install knx-nats-bridge`. The container image
# installs this extra so the same image serves bridge and import job.
import = [
    "psycopg[binary]>=3.3.6",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
knx-nats-bridge = "knx_nats_bridge.main:run"
knx-nats-bridge-import-catalog = "knx_nats_bridge.cli.import_catalog:main"
knxproj-to-yaml = "knx_nats_bridge.tools.knxproj_to_yaml:main"
knxproj-to-kaenx = "knx_nats_bridge.tools.knxproj_to_kaenx:main"
knxproj-check-wiring = "knx_nats_bridge.tools.check_wiring:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# nats-bridge-core is a git tag, not a PyPI release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/knx_nats_bridge"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Neither xknx nor xknxproject ship complete stubs.
module = ["xknx", "xknx.*", "xknxproject", "xknxproject.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# xknx / xknxproject have py.typed but incomplete `__all__` (attr-defined)
# and `XKNXProj.parse()` returns a TypedDict (`KNXProject`) we treat as
# `dict[str, Any]` at the boundary (return-value).
module = [
    "knx_nats_bridge.knx",
    "knx_nats_bridge.writer_rules",
    "knx_nats_bridge.writer",
    "knx_nats_bridge.tools.knxproj_to_yaml",
]
disable_error_code = ["attr-defined", "return-value"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
