name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@e82d92e38cfa50f50ff9483329bec141d35c8dfa # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
