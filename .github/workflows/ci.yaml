name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@22a03376cafb1ac556c128523eb566d66170e125 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
