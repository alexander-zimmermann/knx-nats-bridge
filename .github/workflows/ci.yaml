name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@ed158dd4bd16b69e8f692f0c9754406399958022 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
