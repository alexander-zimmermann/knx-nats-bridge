name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@38b8cedc1f526712627f376635d8a89b904d00d8 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
