name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@1c4242bd2189704dbed4adb4994bf27560313148 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
