name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@f0ef6ac315143b9657f574c9a7ab376b1d7bf74c # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
