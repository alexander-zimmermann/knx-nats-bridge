name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@1410b729bb993c8b515f81a6651f899031761648 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
