name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@35c8f7038793344bc551c58d5bd4269ce894ff3e # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
