name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@011e87554076b99efb42bdf5fc312818be310465 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
