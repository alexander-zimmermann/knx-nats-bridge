name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@e84257368ea9428ff62448d437e03abc4e710c67 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
