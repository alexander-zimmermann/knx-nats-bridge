name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@f887fd81c449e07b9ded800bcb76bd68e3141d98 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
