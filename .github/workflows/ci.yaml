name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@c8cdab9d36faef01c5e9662e97394998783d4b80 # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
