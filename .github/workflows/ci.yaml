name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@241b882b3c427ba8ba343918f9db35e326faef5a # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
