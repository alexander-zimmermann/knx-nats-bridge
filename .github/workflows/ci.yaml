name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-ci.yaml@0e09ca2e2d4e0b3a920aa7be1e3c7b260a1538ba # main
    with:
      python-version: "3.15"
      uv-extras: "dev tools import"
