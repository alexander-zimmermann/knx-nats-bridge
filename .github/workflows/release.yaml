name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@0e28b7460f19fe58c15eb5e2855d5b6b675c7620 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
