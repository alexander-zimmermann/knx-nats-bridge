name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@bc95b75d8b3ad901d2de3b612c4c5f0611fe87a4 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
